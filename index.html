<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday, Sis! 🎂💖</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating balloons -->
  <div class="balloons" aria-hidden="true">
    <span class="balloon balloon1">🎈</span>
    <span class="balloon balloon2">🎈</span>
    <span class="balloon balloon3">🎈</span>
    <span class="balloon balloon4">🎈</span>
    <span class="balloon balloon5">🎈</span>
  </div>

  <!-- Floating hearts (background) -->
  <div class="bg-hearts" aria-hidden="true">
    <span class="bg-heart h1">💗</span>
    <span class="bg-heart h2">💜</span>
    <span class="bg-heart h3">💖</span>
    <span class="bg-heart h4">💓</span>
    <span class="bg-heart h5">💕</span>
  </div>

  <main class="card">
    <h1 class="title">Happy Birthday, Shivani jiji ! 🎂💖</h1>
    <p class="message">
      You are not just my sister, you are my best friend and one of the most special people in my life.
      May your day be filled with happiness, love, and lots of beautiful moments. ❤️
    </p>

    <button id="surpriseBtn" class="surprise-btn">Click for a Surprise 🎁</button>

    <p id="surpriseMessage" class="surprise-message">
      You deserve all the happiness in the world! 💕✨
    </p>
  </main>

  <!-- Confetti and heart bursts get added here by JS -->
  <div id="effectsLayer" class="effects-layer" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
